name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install pytest-homeassistant-custom-component ruff
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest -q
